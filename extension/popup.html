<!doctype html>
<html>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; width: 300px; margin: 0; padding: 14px; }
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .head h3 { margin: 0; font-size: 14px; flex: 1; }
  .ver { font-size: 11px; opacity: .6; }
  .card { border: 1px solid color-mix(in srgb, currentColor 20%, transparent); border-radius: 10px; padding: 10px 12px; }
  .status { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .ok { color: #0a7d2c; } .bad { color: #b3261e; }
  .row { font-size: 12px; opacity: .85; margin-top: 4px; word-break: break-all; }
  #retry { margin-top: 10px; width: 100%; padding: 8px; border: 0; border-radius: 8px;
           background: #0b57d0; color: #fff; font-size: 13px; cursor: pointer; }
  #retry:disabled { opacity: .45; cursor: default; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 11px; opacity: .65; }
  .foot a { color: inherit; }
</style>
<div class="head"><h3 id="title">…</h3><span class="ver" id="ver"></span></div>
<div class="card">
  <div class="status" id="status">…</div>
  <div class="row" id="detail"></div>
  <div class="row" id="hb"></div>
</div>
<button id="retry">…</button>
<div class="foot"><span id="bridge"></span><a id="docs" href="#" target="_blank" rel="noreferrer">…</a></div>
<script src="popup.js"></script>
</html>
